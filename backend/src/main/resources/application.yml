spring:
  application:
    name: narrative-platform-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/narrative_platform}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:5}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  jwt-secret: ${JWT_SECRET:change-this-development-secret-with-at-least-sixty-four-characters-1234567890}
  jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:168}
  invite-expiration-hours: ${INVITE_EXPIRATION_HOURS:168}
  turn-expiration-hours: ${TURN_EXPIRATION_HOURS:24}
  written-lock-expiration-hours: ${WRITTEN_LOCK_EXPIRATION_HOURS:24}
  narrator-reveal-seconds: 10
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  resend:
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:}
    base-url: ${RESEND_BASE_URL:https://api.resend.com}
